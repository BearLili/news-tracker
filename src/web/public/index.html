<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>news-tracker · collectors</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>📊 news-tracker</h1>
  <div id="sse-status" class="disconnected">connecting…</div>
</header>
<nav>
  <button class="tab-btn active" data-tab="forecast">🔮 Forecast (4-day)</button>
  <button class="tab-btn" data-tab="observations">📡 Observations</button>
  <button class="tab-btn" data-tab="npm">💰 NPM Pricing</button>
</nav>
<main>
  <section id="tab-forecast" class="tab active">
    <div class="meta">
      <input type="search" class="city-filter" data-tab="forecast" placeholder="🔍 filter by city or station…">
      <span id="forecast-updated" class="updated">loading…</span>
      <button onclick="loadTab('forecast')">↻ refresh</button>
    </div>
    <div id="forecast-content"></div>
  </section>
  <section id="tab-observations" class="tab">
    <div class="meta">
      <input type="search" class="city-filter" data-tab="observations" placeholder="🔍 filter by city or station…">
      <span id="observations-updated" class="updated">loading…</span>
      <button onclick="loadTab('observations')">↻ refresh</button>
      <span class="time-legend">
        <strong>city</strong> = 城市本地时间（数据观测时刻） ·
        <strong>you</strong> = 你的本地时间 <span id="user-tz"></span>（我们收到 / 看到的时刻）
      </span>
    </div>
    <div id="observations-content"></div>
  </section>
  <section id="tab-npm" class="tab">
    <div class="meta">
      <span id="npm-updated" class="updated">loading…</span>
      <button onclick="loadTab('npm')">↻ refresh</button>
    </div>
    <div id="npm-content"></div>
  </section>
</main>
<!-- 右上角醒目 toast 栈：仅"新高温"等高优先级事件 -->
<div id="toast-stack" aria-live="polite"></div>

<!-- 底部走马灯：所有 SSE 更新事件从右往左滚 -->
<div id="ticker-bar" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
